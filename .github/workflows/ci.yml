name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions épinglées par empreinte de commit (une étiquette se déplace) ; Dependabot les met à jour.

jobs:
  test:
    # Dépôt PUBLIC : machines GitHub, gratuites et isolées. Jamais les runners ARC du cluster ici
    # (une PR de fork y exécuterait son code ; décision de Jonas, 15/11/2026).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compilation (avertissements = erreurs) et tests, contrat partagé compris
        run: mvn -B install
      - name: Les exemples Spring Boot (Java et Kotlin) compilent contre ce SDK
        run: |
          (cd examples/spring-boot && mvn -B -q compile)
          (cd examples/kotlin-spring && mvn -B -q compile)

  securite:
    # Exigences de sécurité (Jonas, 15/11/2026) : analyse statique au plus strict, dépendances
    # vulnérables, secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: SpotBugs (effort max, seuil bas) avec FindSecBugs
        run: mvn -B -DskipTests verify spotbugs:check
      - name: Dépendances vulnérables (OSV-Scanner)
        run: |
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source -L pom.xml
      - name: Secrets dans l'historique
        uses: trufflesecurity/trufflehog@ddc015e5ed99942b2253d8ea16a0586a01ef2ab1 # v3.88.0
        with:
          version: 3.88.0
          extra_args: --only-verified
